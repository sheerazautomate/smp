name: checks

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Same cache key as the extraction workflow, so a change to requirements
      # warms both and a run of either benefits the other.
      - name: Cache pip downloads and wheels
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt', 'scripts/setup_workflow_env.py') }}
          restore-keys: |
            pip-${{ runner.os }}-

      # The unit tests never launch a browser, so this skips the ~170 MB
      # Chromium download entirely and just installs the wheels.
      - name: Install dependencies
        run: python scripts/setup_workflow_env.py --skip-browser

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
